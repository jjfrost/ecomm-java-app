<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Payments')}"></head>
<body>
<div class="app-shell">
    <aside th:replace="~{fragments/layout :: sidebar(${activeNav})}"></aside>
    <section class="app-main">
        <header th:replace="~{fragments/layout :: topbar('Payments', 'Transaction state and processor references')}"></header>
        <main class="content">
            <div th:replace="~{fragments/layout :: flash}"></div>
            <section class="toolbar">
                <form class="search-form" th:action="@{/ui/payments}" method="get">
                    <label class="select-field"><span>Status</span><select name="status"><option value="">All statuses</option><option th:each="status : ${statuses}" th:value="${status}" th:text="${#strings.replace(status.name(), '_', ' ')}" th:selected="${status == selectedStatus}">Status</option></select></label>
                    <button class="button button-secondary" type="submit">Apply</button>
                </form>
                <span class="result-count"><strong th:text="${page.totalElements()}">20</strong> payments</span>
            </section>
            <section class="card table-card">
                <div class="table-wrap">
                    <table>
                        <thead><tr><th>Payment</th><th>Order</th><th>Customer</th><th>Method</th><th>Status</th><th class="align-right">Amount</th><th></th></tr></thead>
                        <tbody>
                        <tr th:each="payment : ${page.content()}">
                            <td><strong class="mono" th:text="${'#' + payment.paymentId()}">#28001</strong><small class="subline" th:text="${payment.processorTransactionId()}">TXN</small></td>
                            <td th:text="${'#' + payment.orderId()}">#25001</td>
                            <td th:text="${'#' + payment.customerId()}">#5001</td>
                            <td th:text="${#strings.replace(payment.paymentMethod().name(), '_', ' ')}">CARD</td>
                            <td><span class="badge badge-payment" th:text="${#strings.replace(payment.paymentStatus().name(), '_', ' ')}">SETTLED</span></td>
                            <td class="align-right currency" th:text="${'$' + #numbers.formatDecimal(payment.amount(), 1, 2)}">$100</td>
                            <td class="align-right"><a class="button button-small button-secondary" th:href="@{/ui/payments/{id}/edit(id=${payment.paymentId()})}">Manage</a></td>
                        </tr>
                        </tbody>
                    </table>
                </div>
                <div class="pagination">
                    <a th:classappend="${page.first()} ? ' disabled'" th:href="@{/ui/payments(page=${page.page() - 1},status=${selectedStatus})}">← Previous</a>
                    <span>Page <strong th:text="${page.page() + 1}">1</strong> of <strong th:text="${page.totalPages() == 0 ? 1 : page.totalPages()}">2</strong></span>
                    <a th:classappend="${page.last()} ? ' disabled'" th:href="@{/ui/payments(page=${page.page() + 1},status=${selectedStatus})}">Next →</a>
                </div>
            </section>
        </main>
    </section>
</div>
</body>
</html>
