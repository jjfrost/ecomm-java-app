<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <title th:text="${title + ' | Northwind Commerce'}">Northwind Commerce</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <script defer th:src="@{/js/app.js}"></script>
</head>
<body>
<aside class="sidebar" th:fragment="sidebar(activeNav)">
    <a class="brand" th:href="@{/ui/dashboard}" aria-label="Northwind Commerce dashboard">
        <span class="brand-mark">NC</span>
        <span>
            <strong>Northwind Commerce</strong>
            <small>Operations Console</small>
        </span>
    </a>
    <nav class="primary-nav" aria-label="Primary navigation">
        <a th:href="@{/ui/dashboard}" th:classappend="${activeNav == 'dashboard'} ? ' active'">
            <span class="nav-icon">⌂</span><span>Overview</span>
        </a>
        <a th:href="@{/ui/customers}" th:classappend="${activeNav == 'customers'} ? ' active'">
            <span class="nav-icon">◎</span><span>Customers</span>
        </a>
        <a th:href="@{/ui/products}" th:classappend="${activeNav == 'products'} ? ' active'">
            <span class="nav-icon">◇</span><span>Products</span>
        </a>
        <a th:href="@{/ui/inventory}" th:classappend="${activeNav == 'inventory'} ? ' active'">
            <span class="nav-icon">▦</span><span>Inventory</span>
        </a>
        <a th:href="@{/ui/orders}" th:classappend="${activeNav == 'orders'} ? ' active'">
            <span class="nav-icon">▤</span><span>Orders</span>
        </a>
        <a th:href="@{/ui/payments}" th:classappend="${activeNav == 'payments'} ? ' active'">
            <span class="nav-icon">◫</span><span>Payments</span>
        </a>
    </nav>
    <div class="sidebar-footer">
        <span class="environment-dot"></span>
        <span>
            <strong>Oracle environment</strong>
            <small>ECOMM schema</small>
        </span>
    </div>
</aside>

<header class="topbar" th:fragment="topbar(title, subtitle)">
    <button class="mobile-nav-button" type="button" data-nav-toggle aria-label="Toggle navigation">☰</button>
    <div class="page-heading">
        <h1 th:text="${title}">Page title</h1>
        <p th:text="${subtitle}">Page subtitle</p>
    </div>
    <div class="user-menu">
        <span class="avatar" th:text="${#strings.substring(currentUser, 0, 1).toUpperCase()}">A</span>
        <span class="user-copy">
            <strong th:text="${currentUser}">Administrator</strong>
            <small>Public demo mode</small>
        </span>
    </div>
</header>

<div th:fragment="flash" class="flash-stack">
    <div class="alert alert-success" th:if="${success}">
        <span aria-hidden="true">✓</span>
        <span th:text="${success}">Success</span>
    </div>
    <div class="alert alert-error" th:if="${error}">
        <span aria-hidden="true">!</span>
        <span th:text="${error}">Error</span>
    </div>
</div>
</body>
</html>
