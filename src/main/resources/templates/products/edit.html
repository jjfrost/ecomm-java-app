<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Edit product')}"></head>
<body>
<div class="app-shell">
    <aside th:replace="~{fragments/layout :: sidebar(${activeNav})}"></aside>
    <section class="app-main">
        <header th:replace="~{fragments/layout :: topbar('Edit product', 'Maintain catalog presentation and pricing')}"></header>
        <main class="content narrow-content">
            <a class="back-link" th:href="@{/ui/products}">← Back to products</a>
            <section class="card form-card">
                <div class="record-heading"><span class="product-thumb large">◇</span><div><h2 th:text="${product.name()}">Product</h2><p><span class="mono" th:text="${product.sku()}">SKU</span> · <span th:text="${'Product ID ' + product.id()}">ID</span></p></div><span class="badge" th:classappend="${product.active()} ? ' badge-active' : ' badge-inactive'" th:text="${product.active()} ? 'Active' : 'Draft'">Active</span></div>
                <div class="alert alert-error" th:if="${error}"><span>!</span><span th:text="${error}">Error</span></div>
                <form class="data-form" th:action="@{/ui/products/{id}(id=${product.id()})}" th:object="${form}" method="post">
                    <div class="form-section">
                        <div class="section-title"><h3>Catalog details</h3><p>Customer-facing name and description.</p></div>
                        <div class="form-grid">
                            <label class="field field-wide"><span>Name</span><input th:field="*{name}" type="text"><small class="field-error" th:errors="*{name}"></small></label>
                            <label class="field field-wide"><span>Description</span><textarea th:field="*{description}" rows="4"></textarea><small class="field-error" th:errors="*{description}"></small></label>
                        </div>
                    </div>
                    <div class="form-section">
                        <div class="section-title"><h3>Commercial settings</h3><p>Base price and catalog category.</p></div>
                        <div class="form-grid">
                            <label class="field"><span>Price (USD)</span><input th:field="*{price}" type="number" step="0.01" min="0.01"><small class="field-error" th:errors="*{price}"></small></label>
                            <label class="field"><span>Category</span><select th:field="*{categoryId}"><option th:each="category : ${categories}" th:value="${category.id()}" th:text="${category.name()}">Category</option></select><small class="field-error" th:errors="*{categoryId}"></small></label>
                        </div>
                    </div>
                    <div class="form-actions"><a class="button button-secondary" th:href="@{/ui/products}">Cancel</a><button class="button button-primary" type="submit">Save product</button></div>
                </form>
            </section>
        </main>
    </section>
</div>
</body>
</html>
